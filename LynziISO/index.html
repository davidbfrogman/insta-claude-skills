<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lynzi ISO Browser</title>
<style>
  :root {
    --bg: #faf7f5; --panel: #ffffff; --ink: #2a2326; --muted: #8a7f84; --line: #ece4e1;
    --accent: #c2185b; --accent-soft: #fce4ec; --new: #2e7d32; --star: #e0a100; --thumb: 200px;
  }
  @media (prefers-color-scheme: dark) {
    :root { --bg: #17141a; --panel: #211d24; --ink: #f1eaee; --muted: #9b8f97; --line: #322b35;
            --accent: #f06292; --accent-soft: #3a2230; --new: #81c784; --star: #ffcc4d; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.4 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; background: var(--bg); color: var(--ink); }
  header { position: sticky; top: 0; z-index: 10; background: var(--panel); border-bottom: 1px solid var(--line); padding: 12px 20px; }
  .row { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; }
  .row + .row { margin-top: 10px; }
  h1 { font-size: 18px; margin: 0 12px 0 0; }
  h1 span { color: var(--accent); }
  .stat { color: var(--muted); }
  input[type=search], select, input[type=date] {
    font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 8px; padding: 6px 10px;
  }
  input[type=search] { width: 220px; }
  select#brand { max-width: 240px; }
  label.ctl { display: inline-flex; align-items: center; gap: 6px; color: var(--muted); }
  button { font: inherit; color: inherit; background: var(--bg); border: 1px solid var(--line); border-radius: 999px; padding: 5px 12px; cursor: pointer; }
  button:hover { border-color: var(--accent); }
  button.on { background: var(--accent); border-color: var(--accent); color: #fff; }
  .chips { display: flex; flex-wrap: wrap; gap: 6px; }
  .chips button { font-size: 12px; padding: 3px 10px; }
  .chips button small { opacity: .7; margin-left: 4px; }
  .spacer { flex: 1; }

  main { padding: 16px 20px 80px; }
  .group-h { position: sticky; top: var(--hdr, 150px); z-index: 5; background: var(--bg); margin: 18px 0 8px; padding: 6px 0;
             font-weight: 600; display: flex; gap: 10px; align-items: baseline; border-bottom: 1px solid var(--line); }
  .group-h small { color: var(--muted); font-weight: 400; }
  .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(var(--thumb), 1fr)); gap: 12px; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 10px; overflow: hidden; cursor: zoom-in; position: relative; }
  .card img { display: block; width: 100%; aspect-ratio: 3 / 4; object-fit: cover; object-position: top; background: var(--line); }
  .card .meta { padding: 6px 8px 8px; }
  .card .brand { font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .brand .star { color: var(--star); margin-right: 3px; }
  .card .date, .card .tags { color: var(--muted); font-size: 12px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .card .badge { background: var(--new); color: #fff; font-size: 10px; font-weight: 700; padding: 1px 5px; border-radius: 5px; margin-left: 6px; vertical-align: 1px; }
  .heart { position: absolute; top: 4px; right: 4px; width: 32px; height: 32px; border-radius: 50%; border: 0; padding: 0;
           background: rgba(0,0,0,.35); color: #fff; font-size: 17px; line-height: 32px; text-align: center; opacity: 0; transition: opacity .15s; }
  .card:hover .heart, .heart.fav { opacity: 1; }
  .heart.fav { background: var(--accent); }
  .empty { text-align: center; color: var(--muted); padding: 80px 0; font-size: 16px; }

  #lb { position: fixed; inset: 0; background: rgba(10,8,12,.92); z-index: 50; display: none; color: #fff; }
  #lb.open { display: flex; }
  #lb .stage { flex: 1; display: flex; align-items: center; justify-content: center; padding: 20px; min-width: 0; }
  #lb img { max-width: 100%; max-height: calc(100vh - 40px); object-fit: contain; border-radius: 6px; }
  #lb aside { width: 300px; padding: 24px 20px; background: rgba(255,255,255,.05); overflow-y: auto; }
  #lb aside h2 { margin: 0 0 4px; font-size: 20px; }
  #lb aside dl { margin: 16px 0; display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; font-size: 13px; }
  #lb aside dt { color: #b9adb3; }
  #lb aside dd { margin: 0; word-break: break-word; }
  #lb aside button, #lb aside a { display: block; width: 100%; margin-top: 8px; text-align: center; color: #fff; background: rgba(255,255,255,.1);
           border: 1px solid rgba(255,255,255,.2); border-radius: 8px; padding: 8px; text-decoration: none; }
  #lb aside button.on { background: var(--accent); border-color: var(--accent); }
  #lb .nav { position: absolute; top: 50%; transform: translateY(-50%); font-size: 28px; background: rgba(255,255,255,.1); border: 0; color: #fff;
             width: 48px; height: 64px; border-radius: 8px; }
  #lb .prev { left: 12px; } #lb .next { right: 312px; }
  #lb .close { position: absolute; top: 12px; right: 312px; background: rgba(255,255,255,.1); border: 0; color: #fff; font-size: 20px; width: 40px; height: 40px; }
  #lb .hint { color: #b9adb3; font-size: 12px; margin-top: 18px; }
  .setup { max-width: 640px; margin: 80px auto; background: var(--panel); padding: 24px 28px; border-radius: 12px; border: 1px solid var(--line); }
  code { background: var(--line); padding: 2px 6px; border-radius: 4px; }
</style>
</head>
<body>
<header id="hdr">
  <div class="row">
    <h1>Lynzi <span>ISO</span> Browser</h1>
    <input type="search" id="q" placeholder="Search brand, type, folder…  ( / )">
    <select id="cat" title="Category"></select>
    <select id="brand" title="Brand"></select>
    <select id="type" title="Product type"></select>
    <button id="topBtn" title="Only brands she starred as Top 20">⭐ Top 20 only</button>
    <button id="favBtn" title="Show only hearted items">♥ Favorites <span id="favCount"></span></button>
  </div>
  <div class="row">
    <label class="ctl">Sort
      <select id="sort">
        <option value="d-desc">Newest saved first (screenshot date)</option>
        <option value="d-asc">Oldest saved first</option>
        <option value="m-desc">Newest file-modified first</option>
        <option value="m-asc">Oldest file-modified first</option>
        <option value="brand-recent">Brand, most recently active first</option>
        <option value="brand-az">Brand A–Z</option>
        <option value="size-desc">Largest file first</option>
      </select>
    </label>
    <label class="ctl">Group
      <select id="group">
        <option value="day">by day</option>
        <option value="month">by month</option>
        <option value="brand">by brand</option>
        <option value="none">none</option>
      </select>
    </label>
    <label class="ctl">Since <input type="date" id="since"></label>
    <span class="stat" id="stat"></span>
    <span class="spacer"></span>
    <label class="ctl">Size <input type="range" id="size" min="120" max="360" step="20" value="200"></label>
  </div>
  <div class="row">
    <div class="chips" id="months"></div>
    <button id="reset" style="font-size:12px;padding:3px 10px">Reset filters</button>
  </div>
</header>
<main id="main"></main>

<div id="lb">
  <div class="stage">
    <button class="nav prev" id="lbPrev" title="Previous (←)">‹</button>
    <img id="lbImg" alt="">
    <button class="nav next" id="lbNext" title="Next (→)">›</button>
    <button class="close" id="lbClose" title="Close (Esc)">✕</button>
  </div>
  <aside>
    <h2 id="lbBrand"></h2>
    <div id="lbPos" style="color:#b9adb3;font-size:12px"></div>
    <dl id="lbMeta"></dl>
    <button id="lbFav">♡ Add to favorites</button>
    <a id="lbOpen" target="_blank">Open full image in new tab</a>
    <button id="lbBrandOnly">Show only this brand</button>
    <button id="lbCopy">Copy file path</button>
    <div class="hint">← → to browse · F to favorite · Esc to close</div>
  </aside>
</div>

<script src="manifest.js"></script>
<script>
(() => {
  const main = document.getElementById('main');
  if (!window.ISO_DATA || !window.ISO_DATA.length || !('br' in window.ISO_DATA[0])) {
    main.innerHTML = `<div class="setup"><h2>Almost there</h2>
      <p>The image list hasn't been built (or is from the old folder layout). In Terminal, run:</p>
      <p><code>python3 LynziISO/build.py</code></p>
      <p>Then reload this page. Re-run it any time new images get added to <code>ISO2/</code>.</p></div>`;
    document.getElementById('hdr').style.display = 'none';
    return;
  }

  const $ = id => document.getElementById(id);
  const enc = p => p.split('/').map(encodeURIComponent).join('/');
  const esc = s => String(s).replace(/[&<>"]/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;' }[c]));
  const DAY = 86400000;
  const fmtDay = new Intl.DateTimeFormat(undefined, { weekday: 'short', month: 'short', day: 'numeric', year: 'numeric' });
  const fmtMonth = new Intl.DateTimeFormat(undefined, { month: 'long', year: 'numeric' });
  const fmtShort = new Intl.DateTimeFormat(undefined, { month: 'short', day: 'numeric', year: 'numeric' });
  const fmtFull = new Intl.DateTimeFormat(undefined, { dateStyle: 'medium', timeStyle: 'short' });
  const pad = n => String(n).padStart(2, '0');
  const monthKey = t => { const d = new Date(t); return d.getFullYear() + '-' + pad(d.getMonth() + 1); };
  const dayKey = t => { const d = new Date(t); return d.getFullYear() + '-' + pad(d.getMonth() + 1) + '-' + pad(d.getDate()); };
  const kb = s => s > 1e6 ? (s / 1e6).toFixed(1) + ' MB' : Math.round(s / 1e3) + ' KB';
  const cap = s => s.charAt(0).toUpperCase() + s.slice(1);

  // ---- data prep
  const items = window.ISO_DATA.map((it, i) => ({
    ...it, i,
    d: it.d || it.m,
    key: it.c + '/' + it.br,                                   // brand key (category-scoped)
    label: it.br === it.c ? it.c : it.br,
    hay: (it.fd + ' ' + it.br + ' ' + it.tg.join(' ') + ' ' + it.n).toLowerCase(),
  }));
  const newestBy = { d: Math.max(...items.map(x => x.d)), m: Math.max(...items.map(x => x.m)) };
  const NEW_WINDOW = 14 * DAY; // "NEW" = within 14 days of the newest image

  const count = (arr, fn) => arr.reduce((acc, x) => { [].concat(fn(x)).forEach(k => acc[k] = (acc[k] || 0) + 1); return acc; }, {});
  const catCount = count(items, x => x.c);
  const brandLatest = {};
  for (const it of items) brandLatest[it.key] = Math.max(brandLatest[it.key] || 0, it.d, it.m);

  // ---- favorites + settings (saved in this browser)
  const FAV_KEY = 'lynziIso.favs', SET_KEY = 'lynziIso.settings.v2';
  const known = new Set(items.map(x => x.p));
  const favs = new Set(JSON.parse(localStorage.getItem(FAV_KEY) || '[]').filter(p => known.has(p)));
  const saveFavs = () => { localStorage.setItem(FAV_KEY, JSON.stringify([...favs])); $('favCount').textContent = favs.size ? `(${favs.size})` : ''; };
  const defaults = { q: '', cat: '', brand: '', type: '', topOnly: false, favOnly: false, sort: 'd-desc', group: 'day', since: '', month: '', size: 200 };
  const state = Object.assign({}, defaults, JSON.parse(localStorage.getItem(SET_KEY) || '{}'));
  const saveState = () => localStorage.setItem(SET_KEY, JSON.stringify(state));

  // ---- dropdowns
  const catOrder = Object.keys(catCount).sort((a, b) => (b === 'Fashion') - (a === 'Fashion') || catCount[b] - catCount[a]);
  $('cat').add(new Option(`All categories (${items.length})`, ''));
  catOrder.forEach(c => $('cat').add(new Option(`${c} (${catCount[c]})`, c)));

  function fillBrands() {
    const sel = $('brand');
    sel.innerHTML = '';
    const pool = items.filter(x => !state.cat || x.c === state.cat);
    const byKey = count(pool, x => x.key);
    sel.add(new Option(`All brands`, ''));
    const cats = state.cat ? [state.cat] : catOrder;
    for (const c of cats) {
      const keys = Object.keys(byKey).filter(k => k.startsWith(c + '/') && k !== c + '/' + c)
        .sort((a, b) => a.localeCompare(b, undefined, { sensitivity: 'base' }));
      if (!keys.length) continue;
      const og = document.createElement('optgroup');
      og.label = c;
      keys.forEach(k => {
        const it = pool.find(x => x.key === k);
        og.appendChild(new Option(`${it.top ? '⭐ ' : ''}${it.br} (${byKey[k]})`, k));
      });
      sel.appendChild(og);
    }
    if (state.brand && !byKey[state.brand]) state.brand = '';
    sel.value = state.brand;
  }

  function fillTypes() {
    const sel = $('type');
    const pool = items.filter(x => (!state.cat || x.c === state.cat) && (!state.brand || x.key === state.brand));
    const byTag = count(pool, x => x.tg);
    const tags = Object.keys(byTag).sort((a, b) => byTag[b] - byTag[a] || a.localeCompare(b));
    sel.innerHTML = '';
    sel.add(new Option('All product types', ''));
    tags.forEach(t => sel.add(new Option(`${cap(t)} (${byTag[t]})`, t)));
    if (state.type && !byTag[state.type]) state.type = '';
    sel.value = state.type;
  }

  // ---- filter + sort
  const dateField = () => state.sort.startsWith('m-') ? 'm' : 'd';
  function baseFilter(it, skipMonth) {
    const q = state.q.trim().toLowerCase();
    const since = state.since ? new Date(state.since + 'T00:00:00').getTime() : 0;
    const f = dateField();
    return (!state.cat || it.c === state.cat) &&
      (!state.brand || it.key === state.brand) &&
      (!state.type || it.tg.includes(state.type)) &&
      (!state.topOnly || it.top) &&
      (!state.favOnly || favs.has(it.p)) &&
      (!q || q.split(/\s+/).every(w => it.hay.includes(w))) &&
      (!since || it[f] >= since) &&
      (skipMonth || !state.month || monthKey(it[f]) === state.month);
  }
  function filtered() {
    const cmp = {
      'm-desc': (a, b) => b.m - a.m,
      'm-asc': (a, b) => a.m - b.m,
      'd-desc': (a, b) => b.d - a.d,
      'd-asc': (a, b) => a.d - b.d,
      'brand-recent': (a, b) => (brandLatest[b.key] - brandLatest[a.key]) || a.key.localeCompare(b.key) || b.d - a.d,
      'brand-az': (a, b) => a.label.localeCompare(b.label, undefined, { sensitivity: 'base' }) || b.d - a.d,
      'size-desc': (a, b) => b.s - a.s,
    }[state.sort];
    return items.filter(it => baseFilter(it)).sort(cmp);
  }

  // month chips reflect the other filters + the active date field
  function renderChips() {
    const f = dateField();
    const mc = count(items.filter(it => baseFilter(it, true)), x => monthKey(x[f]));
    const keys = Object.keys(mc).sort().reverse();
    $('months').innerHTML = keys.map(k => {
      const [y, m] = k.split('-');
      const name = new Date(+y, +m - 1, 1).toLocaleString(undefined, { month: 'short', year: '2-digit' });
      return `<button data-m="${k}" class="${state.month === k ? 'on' : ''}">${name}<small>${mc[k]}</small></button>`;
    }).join('');
  }

  function groupOf(it) {
    const f = dateField();
    if (state.group === 'day') return { k: dayKey(it[f]), t: fmtDay.format(it[f]) };
    if (state.group === 'month') return { k: monthKey(it[f]), t: fmtMonth.format(it[f]) };
    if (state.group === 'brand') return { k: it.key, t: (it.top ? '⭐ ' : '') + it.label + (it.c !== 'Fashion' && it.label !== it.c ? ` · ${it.c}` : '') };
    return null;
  }

  // ---- render
  let view = [];
  function render() {
    saveState();
    view = filtered();
    const f = dateField();
    const word = f === 'd' ? 'Saved' : 'Modified';
    $('stat').textContent = `${view.length.toLocaleString()} of ${items.length.toLocaleString()} images · newest ${fmtShort.format(newestBy[f])}`;
    $('favBtn').classList.toggle('on', state.favOnly);
    $('topBtn').classList.toggle('on', state.topOnly);
    renderChips();

    main.innerHTML = '';
    if (!view.length) { main.innerHTML = '<div class="empty">Nothing matches those filters.</div>'; return; }

    const counts = state.group === 'none' ? {} : count(view, x => groupOf(x).k);
    const frag = document.createDocumentFragment();
    let grid = null, lastKey = null;
    view.forEach((it, idx) => {
      const g = state.group !== 'none' ? groupOf(it) : null;
      if (!grid || (g && g.k !== lastKey)) {
        if (g) {
          const h = document.createElement('div');
          h.className = 'group-h';
          h.innerHTML = `${esc(g.t)} <small>${counts[g.k]} image${counts[g.k] === 1 ? '' : 's'}</small>`;
          frag.appendChild(h);
          lastKey = g.k;
        }
        grid = document.createElement('div');
        grid.className = 'grid';
        frag.appendChild(grid);
      }
      const c = document.createElement('div');
      c.className = 'card';
      c.dataset.idx = idx;
      const isNew = newestBy[f] - it[f] < NEW_WINDOW;
      const sub = [it.c !== 'Fashion' ? it.c : '', it.tg.join(', ')].filter(Boolean).join(' · ');
      c.innerHTML =
        `<img loading="lazy" decoding="async" src="${enc(it.t)}" alt="">` +
        `<button class="heart ${favs.has(it.p) ? 'fav' : ''}" title="Favorite">♥</button>` +
        `<div class="meta"><div class="brand" title="${esc(it.fd)}">${it.top ? '<span class="star">⭐</span>' : ''}${esc(it.label)}</div>` +
        `<div class="date">${word} ${fmtShort.format(it[f])}${isNew ? '<span class="badge">NEW</span>' : ''}</div>` +
        (sub ? `<div class="tags">${esc(sub)}</div>` : '') + `</div>`;
      grid.appendChild(c);
    });
    main.appendChild(frag);
    setHeaderOffset();
  }

  function setHeaderOffset() { document.documentElement.style.setProperty('--hdr', $('hdr').offsetHeight + 'px'); }
  function toggleFav(it) { favs.has(it.p) ? favs.delete(it.p) : favs.add(it.p); saveFavs(); }

  // ---- lightbox
  let cur = -1;
  function openLb(idx) {
    const it = view[idx];
    if (!it) return;
    cur = idx;
    $('lbImg').src = enc(it.p);
    $('lbBrand').textContent = (it.top ? '⭐ ' : '') + it.label;
    $('lbPos').textContent = `${idx + 1} of ${view.length}`;
    $('lbMeta').innerHTML =
      `<dt>Category</dt><dd>${esc(it.c)}</dd>` +
      (it.tg.length ? `<dt>Types</dt><dd>${esc(it.tg.join(', '))}</dd>` : '') +
      (it.top ? `<dt>Top 20</dt><dd>Yes ⭐</dd>` : '') +
      `<dt>Saved</dt><dd>${fmtFull.format(it.d)}</dd>` +
      `<dt>Modified</dt><dd>${fmtFull.format(it.m)}</dd>` +
      `<dt>Size</dt><dd>${kb(it.s)}</dd>` +
      `<dt>Folder</dt><dd>${esc(it.fd)}</dd>` +
      `<dt>File</dt><dd>${esc(it.n)}</dd>`;
    $('lbOpen').href = enc(it.p);
    const fav = favs.has(it.p);
    $('lbFav').textContent = fav ? '♥ Favorited' : '♡ Add to favorites';
    $('lbFav').classList.toggle('on', fav);
    $('lbBrandOnly').style.display = it.label === it.c ? 'none' : '';
    $('lb').classList.add('open');
    [idx - 1, idx + 1].forEach(j => { if (view[j]) new Image().src = enc(view[j].p); });
  }
  function closeLb() {
    $('lb').classList.remove('open');
    $('lbImg').removeAttribute('src');
    const card = main.querySelector(`.card[data-idx="${cur}"]`);
    if (card) {
      card.querySelector('.heart').classList.toggle('fav', favs.has(view[cur].p));
      card.scrollIntoView({ block: 'nearest' });
    }
    cur = -1;
  }
  const step = d => { if (cur >= 0) openLb(Math.min(view.length - 1, Math.max(0, cur + d))); };

  // ---- events
  main.addEventListener('click', e => {
    const card = e.target.closest('.card');
    if (!card) return;
    const it = view[+card.dataset.idx];
    if (e.target.closest('.heart')) {
      e.stopPropagation();
      toggleFav(it);
      e.target.classList.toggle('fav', favs.has(it.p));
      if (state.favOnly) render();
      return;
    }
    openLb(+card.dataset.idx);
  });
  $('lbPrev').onclick = () => step(-1);
  $('lbNext').onclick = () => step(1);
  $('lbClose').onclick = closeLb;
  $('lb').addEventListener('click', e => { if (e.target.classList.contains('stage')) closeLb(); });
  $('lbFav').onclick = () => { toggleFav(view[cur]); openLb(cur); };
  $('lbBrandOnly').onclick = () => {
    const it = view[cur];
    Object.assign(state, { cat: it.c, brand: it.key, type: '', month: '' });
    closeLb(); syncControls(); render(); window.scrollTo(0, 0);
  };
  $('lbCopy').onclick = () => {
    navigator.clipboard?.writeText('LynziISO/' + view[cur].p);
    $('lbCopy').textContent = 'Copied!';
    setTimeout(() => $('lbCopy').textContent = 'Copy file path', 1200);
  };
  document.addEventListener('keydown', e => {
    if ($('lb').classList.contains('open')) {
      if (e.key === 'Escape') closeLb();
      else if (e.key === 'ArrowLeft') step(-1);
      else if (e.key === 'ArrowRight') step(1);
      else if (e.key.toLowerCase() === 'f') $('lbFav').click();
      return;
    }
    if (e.key === '/' && document.activeElement !== $('q')) { e.preventDefault(); $('q').focus(); }
  });

  let t;
  $('q').addEventListener('input', e => { clearTimeout(t); t = setTimeout(() => { state.q = e.target.value; render(); }, 150); });
  $('cat').onchange = e => { state.cat = e.target.value; state.brand = ''; fillBrands(); fillTypes(); render(); };
  $('brand').onchange = e => { state.brand = e.target.value; fillTypes(); render(); };
  $('type').onchange = e => { state.type = e.target.value; render(); };
  $('topBtn').onclick = () => { state.topOnly = !state.topOnly; render(); };
  $('favBtn').onclick = () => { state.favOnly = !state.favOnly; render(); };
  $('sort').onchange = e => {
    state.sort = e.target.value;
    state.month = '';
    if (state.sort.startsWith('brand')) state.group = 'brand';
    else if (state.group === 'brand') state.group = 'day';
    $('group').value = state.group;
    render();
  };
  $('group').onchange = e => { state.group = e.target.value; render(); };
  $('since').onchange = e => { state.since = e.target.value; render(); };
  $('months').addEventListener('click', e => {
    const b = e.target.closest('button'); if (!b) return;
    state.month = state.month === b.dataset.m ? '' : b.dataset.m; render();
  });
  $('size').oninput = e => { state.size = +e.target.value; document.documentElement.style.setProperty('--thumb', state.size + 'px'); saveState(); };
  $('reset').onclick = () => { Object.assign(state, defaults, { size: state.size }); syncControls(); render(); };
  window.addEventListener('resize', setHeaderOffset);

  function syncControls() {
    $('q').value = state.q; $('cat').value = state.cat;
    fillBrands(); fillTypes();
    $('sort').value = state.sort; $('group').value = state.group; $('since').value = state.since; $('size').value = state.size;
    document.documentElement.style.setProperty('--thumb', state.size + 'px');
  }
  syncControls();
  saveFavs();
  render();
})();
</script>
</body>
</html>
